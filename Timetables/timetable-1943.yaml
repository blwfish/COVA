      - {role: rpo,         count: 1}
      - {role: coach,       count: {min: 0, max: 1}}
      - {role: diner,       count: 1}
      - {role: sleeper,     count: {min: 2, max: 5}}
      - {role: observation, count: 1, position: tail}

  passenger_virginia_section:
    description: "Named train Virginia section (lighter consist, fewer Pullmans)"
    power: {class: "L-1 or K-4 Mikado", count: 1}
    segments:
      - {role: baggage,     count: 1, position: head}
      - {role: coach,       count: {min: 2, max: 3}}
      - {role: diner,       count: 1}
      - {role: sleeper,     count: {min: 1, max: 3}}
      - {role: observation, count: 1, position: tail}

  local_freight_val:
    description: "VAL local freight (#404)"
    power: {class: "K-4 Mikado", count: 1}
    segments:
      - {role: caboose,       count: 1, position: head}   # C&O local practice
      - {role: freight_mixed, count: {min: 1, max: 5}}
      - {role: caboose,       count: 1, position: tail}
    note: "Public TT describes '1-car local'; employee TT may show different consist"

  coal_loaded:
    description: "Loaded coal train, northbound (Tidewater → Washington Sub)"
    power: {class: "H-7 2-8-8-2 or similar articulated", count: 1}
    helper_required: false    # helpers at Afton only for westbound; coal loads go east/north
    segments:
      - {role: hopper_loaded, count: {min: 80, max: 130, distribution: normal, mean: 100}}
      - {role: caboose,       count: 1, position: tail}

  coal_empty:
    description: "Empty coal train, eastbound (back to Newport News)"
    power: {class: "H-7 2-8-8-2 or similar", count: 1}
    segments:
      - {role: hopper_empty, count: {min: 80, max: 130}}
      - {role: caboose,      count: 1, position: tail}

  manifest_freight:
    description: "Hot merchandise manifest (#90/#91 or extras)"
    power: {class: "K-4 Mikado or L-1 2-8-2", count: 1}
    segments:
      - {role: boxcar_merchandise, count: {min: 30, max: 60}}
      - {role: caboose,            count: 1, position: tail}

