# ─────────────────────────────────────────────────────────────────────────────
# STOCHASTIC EXTRAS
# These trains ran as extras and are NOT on the timetable.
# Parameters below are historically-calibrated estimates for 1943.
# Modeled as Poisson processes; the orchestrator generates them at runtime.
# ─────────────────────────────────────────────────────────────────────────────

stochastic_extras:

  coal_empties_eastbound:
    description: "Coal empties returning to Tidewater (Newport News direction)"
    direction: eastbound
    path: main_line_west_to_east   # Charlottesville → Arsenal → Richmond → Newport News
    distribution: poisson
    mean_interval_min: 60          # ~1 per hour during war years
    daily_max: 18
    operating_hours: {start: "06:00", end: "23:00"}
    consist_template: coal_empty
    consist_notes: "H-7 articulated or similar 2-8-8-2; 80-130 empty hoppers; tail caboose only"

  coal_loads_northbound_via_val:
    description: "Coal loads from Tidewater via VAL, northbound to Washington Sub"
    direction: northbound
    path: val_to_washington_sub    # Strathmore → Lindsay → Gordonsville → Washington Sub
    distribution: uniform
    daily_count: {min: 4, max: 6}
    operating_hours: {start: "04:00", end: "22:00"}
    consist_template: coal_loaded
    consist_notes: "H-7 articulated; 80-130 loaded hoppers; tail caboose only. NO head-end caboose (through freight)."

  merchandise_extras_westbound:
    description: "Merchandise/mixed freight extras, westbound"
    direction: westbound
    path: main_line_east_to_west
    distribution: poisson
    mean_interval_min: 180         # ~2-3 per day; rough estimate
    daily_max: 6
    operating_hours: {start: "08:00", end: "22:00"}
    consist_template: manifest_freight

