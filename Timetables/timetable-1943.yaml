# C&O Virginia Division — Historical Timetable
# Public Timetable: October 24, 1943 (authority for major city times)
# Employee TT No. 132: August 22, 1943, Richmond Division (authority for intermediate stations)
#
# CONFIDENCE KEY:
#   HIGH   — read directly from public TT condensed schedule (pages 4–6) or confirmed by both TTs
#   MEDIUM — read from employee TT August 1943 pages 6–9; close to October schedule for GW/Sportsman;
#            for FFV, subtract ~2h10m from employee TT times to approximate October 1943 schedule
#   EST    — interpolated from known times; not directly read
#   UNCERT — read from scanned tables with significant uncertainty; verify against physical document
#
# NOTES:
#   1. All times are Eastern War Time (= Eastern Standard Time in 1943).
#   2. Employee TT column labeling vs public TT numbering sometimes swaps Washington-section
#      and Virginia-section numbers. Timings are cross-checked against public TT; conflicts noted.
#   3. The FFV schedule changed between August and October 1943. Employee TT shows
#      Train 3 (Washington section) departing DC at 11:25 PM; public TT Oct shows 9:15 PM.
#      All FFV intermediate-station times use the October 1943 adjustment (~-2h10m from Aug TT).
#   4. GW and Sportsman employee TT (Aug) times are within ~30 min of October public TT.
#   5. "Arsenal" = Mineral, VA, 58.1 miles east of Richmond on Piedmont Sub-Division.
#      Appears in employee TT as "Mineral ⊗".
#   6. Lindsay is 4.8 miles west of Gordonsville (Piedmont Sub mileage: 77.8 from Richmond,
#      82.6 at Lindsay); Charlottesville is 21 miles west of Gordonsville.
#
# TIMETABLE SIMULATOR USAGE:
#   Pin arrival at Gordonsville (the primary viewing location).
#   staging_launch_time = gordonsville_arrive_time - empirically_measured_running_time_from_staging
#   Fast clock ratio (tentative): 4:1

metadata:
  reference_date: "1943-10-24"          # public timetable date
  employee_tt_date: "1943-08-22"        # Employee TT No. 132, Richmond Division
  territory: "C&O Virginia Division — Richmond and Washington Sub-Divisions"
  layout_viewing_pin: gordonsville      # timetable simulator anchor station

